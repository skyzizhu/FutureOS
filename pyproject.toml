[project]
name = "futureos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "futureos-prediction-engine",
 "fastapi>=0.120,<1",
 "uvicorn>=0.38,<1",
 "sqlalchemy>=2.0,<2.1",
 "alembic>=1.17,<2",
 "psycopg[binary]>=3.2,<4",
 "redis>=7,<8",
 "pydantic-settings>=2.11,<3",
 "httpx>=0.28,<1",
 "cryptography>=50.0.0,<51",
 "pyotp>=2.9,<3",
]
[tool.uv.workspace]
members = ["services/prediction_engine"]
[tool.uv.sources]
futureos-prediction-engine = { workspace = true }
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<2", "jsonschema>=4.25,<5", "types-jsonschema>=4,<5"]
local = [
    "pgserver==0.1.4",
    "redislite==6.2.912183",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["services"]
exclude = ["infra/migrations"]
